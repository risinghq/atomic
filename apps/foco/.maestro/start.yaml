appId: com.risinghq.foco
name: Start a timeboxed task and see the next chime
---
- launchApp:
    permissions:
      notifications: allow

- assertVisible: 'Bienvenido a Foco'
- tapOn: '10 min'
- tapOn: 'Continuar'

- tapOn: 'Empezar'
- tapOn: 'Tarea'
- inputText: 'correo'
- tapOn: '45 min'
- tapOn: 'Listo'

- assertVisible: 'correo'
- assertVisible: '0 de 45 min'
- assertVisible: 'Próximo aviso a las.*'

- tapOn: 'Hoy'
- assertVisible: 'correo'

- tapOn: 'Ajustes'
- assertVisible:
    text: '10 min'
    selected: true
- tapOn:
    text: 'Voz'
    checked: false
- assertVisible:
    text: 'Voz'
    checked: true
