appId: com.empiricalhq.foco
name: Start a timeboxed task and see the next chime
---
- launchApp:
    permissions:
      notifications: allow

- tapOn: 'Empezar'
- tapOn: 'Tarea'
- inputText: 'correo'
- tapOn: '45 min'
- tapOn: 'Listo'

- assertVisible: 'correo'
- assertVisible: '0 de 45 min'
- assertVisible: 'Próximo aviso a las.*'

- tapOn: 'Hoy'
- assertVisible: 'correo'

- tapOn: 'Ahora'
- scrollUntilVisible:
    element: 'Dice la hora en voz alta.*'
- tapOn:
    text: 'Voz'
    checked: false
- assertVisible:
    text: 'Voz'
    checked: true
