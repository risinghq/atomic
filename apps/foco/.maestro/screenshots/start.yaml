appId: com.risinghq.foco
name: Start the first task of the day on a fresh install
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- tapOn: 'Continuar'
- tapOn: 'Empezar'
- tapOn: 'Tarea'
- inputText: 'Correo'
- tapOn: 'Sin límite'
- tapOn: 'Listo'
- assertVisible: 'Correo'
