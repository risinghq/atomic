        NOTE: 'Pago mensual',
        CATEGORY: 'Sueldo',
      }
- runFlow:
    file: add.yaml
    env:
      { K1: '0', K2: '9', K3: '5', K4: '0', NOTE: 'Alquiler', CATEGORY: 'Casa' }
- runFlow:
    file: add.yaml
    env:
      {
        K1: '0',
        K2: '1',
        K3: '8',
        K4: '4',
        NOTE: 'Mercado',
        CATEGORY: 'Comida',
      }
- runFlow:
    file: add.yaml
    env:
      {
        K1: '0',
        K2: '0',
        K3: '8',
        K4: '5',
