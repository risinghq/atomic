name: E2E

on:
  push:
    branches: [master]
    paths:
      - 'apps/atomic/**'
      - 'packages/**'
      - 'bun.lock'
      - 'mise.toml'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'apps/atomic/**'
      - 'packages/**'
      - 'bun.lock'
      - 'mise.toml'
      - '.github/workflows/e2e.yml'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      - run: bun install --frozen-lockfile

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build the release APK
        run: bun run --cwd apps/atomic apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start the emulator
        run: bun run --cwd apps/atomic emulator

      - name: Run the flows
        run: bun run --cwd apps/atomic e2e

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro
          path: ~/.maestro/tests
          if-no-files-found: ignore
